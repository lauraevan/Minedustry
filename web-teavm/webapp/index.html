<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Mindustry Web</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
    #game{display:block;width:100%;height:100%;touch-action:none;outline:none;background:#111}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#111;z-index:3}
    #boot>div{width:min(420px,75vw)}
    #label{font-size:14px;margin-bottom:10px;color:#ccc} #bar{height:6px;background:#2a2a2a} #fill{height:100%;width:0;background:#ffd37f}
    #fatal{white-space:pre-wrap;color:#ff9b9b;font:13px/1.45 monospace;margin-top:16px}
  </style>
</head>
<body>
<div id="app"><canvas id="game" tabindex="0"></canvas></div>
<div id="boot"><div><div id="label">Loading Mindustry assets…</div><div id="bar"><div id="fill"></div></div><div id="fatal"></div></div></div>
<script src="mindustry.js"></script>
<script>
(async()=>{
  const boot=document.getElementById('boot'), fill=document.getElementById('fill'), label=document.getElementById('label'), fatal=document.getElementById('fatal');
  try{
    const response=await fetch('assetpack.bin',{cache:'no-cache'});
    if(!response.ok) throw new Error('assetpack.bin HTTP '+response.status);
    const buffer=await response.arrayBuffer();
    const view=new DataView(buffer); const manifestLength=view.getUint32(0,false);
    const manifest=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,4,manifestLength)));
    const base=4+manifestLength; const assets=Object.create(null);
    for(let i=0;i<manifest.files.length;i++){
      const e=manifest.files[i]; assets[e.path]=new Uint8Array(buffer,base+e.offset,e.length);
      if((i&31)===0) fill.style.width=((i/manifest.files.length)*100).toFixed(1)+'%';
    }
    window.__mindustryAssets=assets; window.__mindustryAssetManifest=manifest;
    fill.style.width='100%'; label.textContent='Starting Mindustry…';
    mindustryMain();
    boot.remove(); document.getElementById('game').focus();
  }catch(err){
    label.textContent='Mindustry failed to boot'; fatal.textContent=String(err && err.stack || err); console.error(err);
  }
})();
</script>
</body>
</html>
