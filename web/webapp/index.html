<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mindustry Web</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;background:#111;overflow:hidden}
    body{touch-action:none;overscroll-behavior:none}
    canvas{display:block;width:100%!important;height:100%!important}
    #boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;
      font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#111;z-index:10}
  </style>
</head>
<body>
  <div id="boot">Loading Mindustry…</div>
  <div id="app"></div>
  <script>
    window.addEventListener("error", function(e){
      var boot=document.getElementById("boot");
      if(boot) boot.textContent="Web port error: "+(e.message||"unknown error");
    });
  </script>
  <script src="mindustry/mindustry.nocache.js"></script>
</body>
</html>
