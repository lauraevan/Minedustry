name: Mindustry web port compile

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (use a >=32 GB runner if you have one; ubuntu-latest works via swap but is slow)"
        default: "ubuntu-latest"
  push:
    paths:
      - "bootstrap.sh"
      - "scripts/**"
      - "web-teavm/**"
      - "web/**"
      - "SOURCE_PINS.json"

# Needed for the deploy-to-Pages job.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    # Swap-backed GC is slow; on a 16 GB runner the full compile can take a long time.
    # On a >=32 GB runner it finishes in a fraction of this.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add swap so the TeaVM compile has enough virtual memory
        run: |
          # The whole-game codegen needs ~20-28 GB of heap. On a 16 GB runner that only
          # fits with swap as overflow (the JVM's cold pages page out instead of OOM).
          # NOTE: the runner already has an active /swapfile, and the OS disk (/) is small,
          # so add a SEPARATE large swapfile on /mnt (the ~70 GB scratch disk) instead of
          # touching the existing one.
          df -h / /mnt || true
          SWAP=/mnt/teavm-swapfile
          sudo swapoff "$SWAP" 2>/dev/null || true
          sudo rm -f "$SWAP"
          sudo dd if=/dev/zero of="$SWAP" bs=1M count=40960 status=progress
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          sudo sysctl vm.swappiness=10
          swapon --show
          free -h

      - name: Static validation
        run: |
          # Run validate_kit first: py_compile below creates __pycache__ dirs, which
          # validate_kit's "no generated cache files bundled" check would then flag.
          python3 scripts/validate_kit.py
          python3 -m py_compile scripts/*.py web-teavm/pack_assets.py
          bash -n bootstrap.sh

      - name: Build exact current Mindustry web target
        # jitpack.io is reachable on GitHub runners, so bootstrap resolves rhino directly.
        run: ./bootstrap.sh "$RUNNER_TEMP/mindustry-web"

      - name: Upload browser distribution artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-web-dist
          path: ${{ runner.temp }}/mindustry-web/Mindustry/web-teavm/build/dist
          if-no-files-found: error

      - name: Package dist for GitHub Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mindustry-web/Mindustry/web-teavm/build/dist

  # Publishes the built dist to a live URL. Enable Pages once in the repo:
  # Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
