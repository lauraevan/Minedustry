name: Mindustry web port compile

on:
  workflow_dispatch:
  push:
    paths:
      - "bootstrap.sh"
      - "scripts/**"
      - "web-teavm/**"
      - "web/**"
      - "SOURCE_PINS.json"

jobs:
  teavm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Static validation
        run: |
          python3 -m py_compile scripts/*.py web-teavm/pack_assets.py
          bash -n bootstrap.sh
          python3 scripts/validate_kit.py
      - name: Build exact current Mindustry web target
        run: ./bootstrap.sh "$RUNNER_TEMP/mindustry-web"
      - name: Upload browser distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-web-dist
          path: ${{ runner.temp }}/mindustry-web/Mindustry/web-teavm/build/dist
          if-no-files-found: error
